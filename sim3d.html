<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三臂凿岩台车 · 交互教学</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23151A20'/%3E%3Crect x='16' y='24' width='34' height='9' rx='4.5' transform='rotate(-45 33 28)' fill='%23F5B82E'/%3E%3Ccircle cx='33' cy='28' r='5' fill='%23E9EDF1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* ============ 基础与变量 ============ */
:root{
  --bg:#0F1215;
  --panel:rgba(21,26,32,.92);
  --panel-solid:#151A20;
  --panel2:#1A2129;
  --line:#27303A;
  --line-soft:#20272F;
  --text:#E9EDF1;
  --muted:#9BA6B0;
  --dim:#66717C;
  --accent:#F5B82E;
  --accent-hi:#FFC96B;
  --blue:#3EA8FF;
  --ok:#3FB57B;
  --mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  position:fixed;inset:0;overflow:hidden;
  font-family:var(--sans);
  color:var(--text);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
button{font-family:var(--sans);border:0;background:none;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ============ 3D 画布 ============ */
#canvas-container{position:absolute;inset:0}
#canvas-container canvas{display:block;width:100%;height:100%}

/* ============ HUD 通用 ============ */
.hud{position:absolute;z-index:10}

/* ============ 顶栏 ============ */
.hud-top{
  top:0;left:0;right:0;
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:10px;padding:12px 14px;
  pointer-events:none;
  background:linear-gradient(to bottom, rgba(15,18,21,.9), rgba(15,18,21,0));
}
.title-block{pointer-events:auto;min-width:0}
.eyebrow{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
  color:var(--accent);margin-bottom:5px;white-space:nowrap;
}
.title-block h1{
  font-size:21px;font-weight:900;letter-spacing:.02em;line-height:1.15;white-space:nowrap;
}
.title-block p.sub{
  font-size:11.5px;color:var(--muted);margin-top:4px;white-space:nowrap;
}
.controls{
  display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;
  pointer-events:auto;max-width:64%;
}
.ctl-btn{
  display:flex;align-items:center;gap:5px;
  padding:8px 11px;border-radius:9px;
  font-size:12px;font-weight:500;color:var(--text);
  background:var(--panel);border:1px solid var(--line);
  transition:border-color .18s,background .18s,color .18s;
  -webkit-tap-highlight-color:transparent;
  min-height:36px;
}
.ctl-btn svg{width:14px;height:14px;flex:none}
.ctl-btn:hover{border-color:var(--accent)}
.ctl-btn.on{background:var(--accent);border-color:var(--accent);color:#1A1206;font-weight:700}
.ctl-btn .lbl{white-space:nowrap}

/* ============ 部件清单（左侧） ============ */
#partsPanel{
  top:88px;left:12px;bottom:14px;width:236px;
  display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;
  transform:translateX(-120%);
  transition:transform .28s cubic-bezier(.22,1,.36,1);
}
#partsPanel.open{transform:translateX(0)}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 13px;border-bottom:1px solid var(--line);
}
.panel-head .ph-title{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.panel-head .ph-count{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
#partsList{flex:1;overflow-y:auto;padding:6px 6px 10px}
#partsList::-webkit-scrollbar{width:5px}
#partsList::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.grp-label{
  font-size:10.5px;letter-spacing:.14em;color:var(--dim);
  padding:10px 8px 5px;font-weight:700;
}
.p-item{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:7px 8px;border-radius:7px;text-align:left;
  font-size:13px;color:var(--text);line-height:1.3;
  transition:background .15s;
}
.p-item:hover{background:rgba(255,255,255,.05)}
.p-item.sel{background:rgba(245,184,46,.14)}
.p-item .idx{font-family:var(--mono);font-size:10px;color:var(--dim);width:20px;flex:none}
.p-item .chip{width:9px;height:9px;border-radius:3px;flex:none}
.p-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-item.kid{padding-left:38px;font-size:12.5px}
.p-item.kid .idx{visibility:hidden}

/* ============ 信息面板（右侧） ============ */
#infoPanel{
  top:88px;right:12px;width:min(356px,calc(100vw - 24px));
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 16px 12px;
  opacity:0;visibility:hidden;transform:translateY(8px);
  transition:opacity .25s,transform .25s,visibility .25s;
  pointer-events:auto;
  max-height:calc(100% - 190px);overflow-y:auto;
}
#infoPanel.open{opacity:1;visibility:visible;transform:translateY(0)}
.info-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.info-tag{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--accent);
  border:1px solid rgba(245,184,46,.4);border-radius:20px;padding:3px 9px;
}
.info-close{color:var(--dim);padding:4px;border-radius:6px;display:flex}
.info-close:hover{color:var(--text);background:rgba(255,255,255,.06)}
.info-close svg{width:15px;height:15px}
.info-title{font-size:18px;font-weight:800;letter-spacing:.01em;margin:8px 0 1px}
.info-en{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.info-desc{font-size:13px;line-height:1.7;color:#C6CFD6;margin:10px 0 11px}
.specs{border-top:1px solid var(--line-soft);padding-top:9px}
.spec-row{display:flex;gap:10px;padding:4px 0;font-size:12px;line-height:1.5}
.spec-row .k{flex:none;width:82px;color:var(--dim)}
.spec-row .v{flex:1;color:#D7DEE4;font-family:var(--mono);font-size:11.5px}
.info-note{font-size:10.5px;color:var(--dim);margin-top:10px;line-height:1.6}

/* ============ 底部作业流程 ============ */
#workflow{
  left:50%;transform:translateX(-50%);bottom:16px;
  display:flex;align-items:center;gap:2px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:7px 10px;
  max-width:calc(100vw - 24px);overflow-x:auto;
  pointer-events:auto;
}
#workflow::-webkit-scrollbar{display:none}
.wf-step{
  display:flex;align-items:center;gap:6px;white-space:nowrap;
  padding:5px 9px;border-radius:8px;font-size:11.5px;color:var(--muted);
}
.wf-step .wf-idx{font-family:var(--mono);font-size:10px;color:var(--dim)}
.wf-step.cur{background:rgba(245,184,46,.16);color:var(--accent-hi);font-weight:700}
.wf-step.cur .wf-idx{color:var(--accent)}
.wf-arrow{color:var(--dim);font-size:11px;flex:none;padding:0 1px}

/* ============ 提示条 + 服务状态 ============ */
#hintWrap{
  right:14px;bottom:18px;display:flex;flex-direction:column;align-items:flex-end;gap:7px;
  pointer-events:none;
}
#apiChip{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;
  color:var(--muted);background:var(--panel);
  border:1px solid var(--line);border-radius:20px;padding:4px 10px;
}
#apiChip .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
#apiChip.on .dot{background:var(--ok);box-shadow:0 0 6px rgba(63,181,123,.8)}
#apiChip.off .dot{background:var(--dim)}
#hintBar{
  font-size:11px;color:var(--dim);
  font-family:var(--mono);letter-spacing:.02em;text-align:right;pointer-events:none;
}

/* ============ 3D 标签 ============ */
#labels{position:absolute;inset:0;pointer-events:none;z-index:8}
.tag{
  position:absolute;left:0;top:0;
  display:flex;align-items:center;gap:6px;
  padding:4px 9px;border-radius:20px;
  background:rgba(15,18,21,.78);border:1px solid rgba(158,174,187,.28);
  font-size:11.5px;color:#E4E9ED;white-space:nowrap;
  opacity:0;transition:opacity .25s;
  will-change:transform,left,top;
}
.tag .dot{width:6px;height:6px;border-radius:50%;flex:none}
.tag .t-idx{font-family:var(--mono);font-size:9.5px;color:var(--dim)}
#labels.hide{display:none}

/* ============ 移动端抽屉按钮 ============ */
#menuToggle{
  left:12px;bottom:18px;width:44px;height:44px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--text);
}
#menuToggle svg{width:18px;height:18px}
#scrim{position:fixed;inset:0;background:rgba(6,8,10,.5);opacity:0;visibility:hidden;transition:.25s;z-index:9}
#scrim.show{opacity:1;visibility:visible}

/* ============ 学习资料面板（居中模态） ============ */
#learnPanel{
  position:fixed;left:50%;top:50%;z-index:40;
  transform:translate(-50%,-46%) scale(.98);
  width:min(700px,calc(100vw - 20px));
  max-height:min(600px,calc(100vh - 90px));
  display:flex;flex-direction:column;
  background:rgba(19,24,30,.97);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 24px 70px rgba(0,0,0,.55);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .22s,transform .22s,visibility .22s;
}
#learnPanel.open{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.lp-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 16px 0;
}
.lp-title{font-size:15px;font-weight:800;letter-spacing:.02em}
.lp-title .lp-en{font-family:var(--mono);font-size:10.5px;color:var(--dim);font-weight:500;letter-spacing:.14em;display:block;margin-top:2px}
.lp-close{color:var(--dim);padding:5px;border-radius:7px;display:flex}
.lp-close:hover{color:var(--text);background:rgba(255,255,255,.06)}
.lp-close svg{width:16px;height:16px}
.lp-tabs{
  display:flex;gap:4px;padding:12px 16px 0;border-bottom:1px solid var(--line-soft);
  overflow-x:auto;
}
.lp-tabs::-webkit-scrollbar{display:none}
.lp-tab{
  flex:none;padding:8px 14px;border-radius:8px 8px 0 0;
  font-size:12.5px;font-weight:600;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.lp-tab:hover{color:var(--text)}
.lp-tab.on{color:var(--accent-hi);border-bottom-color:var(--accent)}
.lp-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.lp-body::-webkit-scrollbar{width:6px}
.lp-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.tab-pane{display:none}
.tab-pane.on{display:flex;flex-direction:column;gap:14px}
.pgroup,.kgroup{
  background:var(--panel2);border:1px solid var(--line-soft);border-radius:10px;
  padding:12px 14px;
}
.pgroup .pg-title,.kgroup .kg-title{
  font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--accent);
  margin-bottom:8px;
}
.pgroup table{width:100%;border-collapse:collapse;table-layout:fixed}
.pgroup td{padding:5px 0;font-size:12px;line-height:1.5;vertical-align:top}
.pgroup td.k{width:38%;color:var(--dim)}
.pgroup td.v{color:#D7DEE4;font-family:var(--mono);font-size:11.5px}
.pgroup .pg-note{font-size:11px;color:var(--dim);line-height:1.6;margin-top:8px;border-top:1px dashed var(--line-soft);padding-top:8px}
.kgroup ul{list-style:none}
.kgroup li{
  position:relative;padding:4px 0 4px 16px;
  font-size:12.5px;line-height:1.65;color:#C6CFD6;
}
.kgroup li::before{
  content:"";position:absolute;left:2px;top:11px;
  width:6px;height:6px;border-radius:2px;background:var(--accent);
}

/* 学习数据 */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-card{
  background:var(--panel2);border:1px solid var(--line-soft);border-radius:10px;
  padding:12px 10px;text-align:center;
}
.stat-card .num{
  font-family:var(--mono);font-size:21px;font-weight:700;color:var(--text);
  line-height:1.15;
}
.stat-card .lbl{font-size:10.5px;color:var(--dim);margin-top:4px;letter-spacing:.05em}
.rank-head,.rank-row{
  display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:12px;
}
.rank-head{font-size:11px;color:var(--dim);letter-spacing:.06em;border-bottom:1px solid var(--line-soft);margin-bottom:2px}
.rank-row .rk{font-family:var(--mono);font-size:11px;color:var(--dim);width:22px;flex:none}
.rank-row .rn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-row .rv{font-family:var(--mono);font-size:11px;color:var(--accent-hi)}
.rank-row .bar{height:4px;border-radius:2px;background:rgba(245,184,46,.35);width:60px;flex:none;overflow:hidden}
.rank-row .bar i{display:block;height:100%;background:var(--accent)}
.stat-empty{font-size:12.5px;color:var(--dim);text-align:center;padding:26px 10px;line-height:1.8}
.stat-mode{
  font-size:10.5px;color:var(--dim);font-family:var(--mono);
  border:1px dashed var(--line);border-radius:8px;padding:8px 10px;line-height:1.6;
}
.stat-mode b{color:var(--muted);font-weight:600}

/* ============ 启动遮罩 ============ */
#splash{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:var(--bg);transition:opacity .5s;
}
#splash.done{opacity:0;pointer-events:none}
.sp-logo svg{width:46px;height:46px}
.sp-txt{font-size:12.5px;color:var(--muted);letter-spacing:.08em}
.sp-bar{width:150px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.sp-bar i{display:block;height:100%;width:38%;background:var(--accent);animation:loadbar 1.1s ease-in-out infinite}
@keyframes loadbar{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
#splash.err .sp-txt{color:#FF7A6B}

/* ============ 入场动画 ============ */
.title-block,.controls,.panel-head,#workflow,#hintWrap{opacity:0}
body.ready .title-block{animation:fadeUp .6s cubic-bezier(.22,1,.36,1) .15s forwards}
body.ready .controls{animation:fadeUp .6s cubic-bezier(.22,1,.36,1) .35s forwards}
body.ready .panel-head{animation:fadeUp .6s cubic-bezier(.22,1,.36,1) .5s forwards}
body.ready #workflow{animation:fadeUp .6s cubic-bezier(.22,1,.36,1) .65s forwards}
body.ready #hintWrap{animation:fadeUp .6s cubic-bezier(.22,1,.36,1) .8s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
#workflow{transform:translateX(-50%)}
body.ready #workflow{animation:fadeUp .6s cubic-bezier(.22,1,.36,1) .65s forwards}

/* ============ 桌面端 ============ */
@media (min-width:768px){
  .hud-top{padding:16px 20px}
  .title-block h1{font-size:26px}
  .title-block p.sub{font-size:12.5px}
  .ctl-btn{padding:9px 14px;font-size:12.5px;min-height:40px}
  #partsPanel{left:16px;top:96px;width:252px;transform:none}
  #menuToggle,#scrim{display:none}
  #infoPanel{top:96px;right:16px}
  #hintWrap{right:18px;bottom:20px}
  #workflow{bottom:20px}
  .tag{font-size:12px;padding:5px 11px}
}

/* ============ 窄屏学习面板 ============ */
@media (max-width:480px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .lp-tabs{padding-left:12px;padding-right:12px}
  .lp-body{padding:12px}
}

/* ============ 无障碍：减弱动效 ============ */
@media (prefers-reduced-motion:reduce){
  .title-block,.controls,.panel-head,#workflow,#hintWrap{opacity:1;animation:none}
  .sp-bar i{animation:none;width:100%}
  #splash{transition:none}
}

/* ============ AI 教学助教（DeepSeek） ============ */
#aiFab{
  position:fixed;right:14px;bottom:80px;z-index:30;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  width:52px;height:52px;border-radius:16px;
  background:linear-gradient(160deg,#1E262F,#151A20);
  border:1px solid var(--line);color:var(--accent);
  box-shadow:0 10px 28px rgba(0,0,0,.5);
  transition:border-color .18s,transform .18s;
  -webkit-tap-highlight-color:transparent;
}
#aiFab svg{width:22px;height:22px}
#aiFab span{font-size:9px;letter-spacing:.04em;color:var(--muted)}
#aiFab:hover{border-color:var(--accent);transform:translateY(-1px)}
#aiFab.on{background:var(--accent);color:#1A1206;border-color:var(--accent)}
#aiFab.on span{color:#1A1206}
#aiChat{
  position:fixed;right:14px;bottom:142px;z-index:30;
  width:min(370px,calc(100vw - 24px));
  height:min(560px,calc(100vh - 162px));
  display:flex;flex-direction:column;
  background:rgba(19,24,30,.98);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 24px 70px rgba(0,0,0,.55);
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translateY(10px) scale(.98);
  transition:opacity .2s,transform .2s,visibility .2s;
  overflow:hidden;
}
#aiChat.open{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0) scale(1)}
.aic-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 14px 10px;border-bottom:1px solid var(--line);
}
.aic-eyebrow{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--accent);margin-bottom:3px}
.aic-name{font-size:14px;font-weight:700;letter-spacing:.03em}
.aic-tools{display:flex;gap:4px}
.aic-tools button{
  width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);
  transition:background .15s,color .15s;
}
.aic-tools button:hover{background:rgba(255,255,255,.06);color:var(--text)}
.aic-tools svg{width:15px;height:15px}
.aic-body{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:10px}
.aic-body::-webkit-scrollbar{width:5px}
.aic-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.aic-msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.aic-msg.user{align-self:flex-end;background:rgba(245,184,46,.16);border:1px solid rgba(245,184,46,.35);border-bottom-right-radius:4px}
.aic-msg.bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--line-soft);border-bottom-left-radius:4px}
.aic-msg.err{align-self:flex-start;background:rgba(255,90,90,.08);border:1px solid rgba(255,90,90,.3);color:#FFB4B4}
.aic-msg .aic-role{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--dim);margin-bottom:4px}
.aic-msg.user .aic-role{color:var(--accent)}
.aic-typing{display:inline-flex;gap:4px;padding:4px 2px}
.aic-typing i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:aicBlink 1.2s infinite}
.aic-typing i:nth-child(2){animation-delay:.2s}
.aic-typing i:nth-child(3){animation-delay:.4s}
@keyframes aicBlink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.aic-input{display:flex;align-items:flex-end;gap:8px;padding:10px 12px 8px;border-top:1px solid var(--line)}
#aiInput{
  flex:1;resize:none;overflow-y:hidden;background:var(--panel-solid);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.45;
  padding:9px 11px;max-height:110px;
}
#aiInput:focus{outline:none;border-color:var(--accent)}

<script>
/* ================= AI 教学助教（DeepSeek，双模式：本地 /api/chat · 静态云端代理） ================= */
(function(){
'use strict';
/* ---- 配置 ---- */
var AI_PROXY_URL = ''; /* 在线模式：部署 Cloudflare Worker 代理后填入，如 'https://xxx.workers.dev/chat'；本地模式留空即可 */
var AI_MODEL = 'deepseek-chat';
var AI_MAX_TOKENS = 2048;
var AI_LS_KEY = 'jumbo_ai_chat_v1';
var AI_MAX_HISTORY = 20;

var fab = document.getElementById('aiFab');
var panel = document.getElementById('aiChat');
var msgsEl = document.getElementById('aiMsgs');
var inputEl = document.getElementById('aiInput');
var sendBtn = document.getElementById('aiSend');
var statusEl = document.getElementById('aiStatus');
var openFlag = false;
var busy = false;
var history = [];

function loadHistory(){ try{ var h = JSON.parse(localStorage.getItem(AI_LS_KEY)); if(Array.isArray(h)) history = h.slice(-AI_MAX_HISTORY); }catch(e){ history = []; } }
function saveHistory(){ try{ localStorage.setItem(AI_LS_KEY, JSON.stringify(history.slice(-AI_MAX_HISTORY))); }catch(e){} }

function addMsg(role, text, cls){
  var d = document.createElement('div');
  d.className = 'aic-msg ' + (cls || role);
  var r = document.createElement('span');
  r.className = 'aic-role';
  r.textContent = (role === 'user') ? '你' : 'AI 助教';
  d.appendChild(r);
  var t = document.createElement('span');
  t.textContent = text;
  d.appendChild(t);
  msgsEl.appendChild(d);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return d;
}
function setStatus(t){ statusEl.textContent = t || ''; }
function setBusy(b){ busy = b; sendBtn.disabled = b; }
function backendMode(){ return (window.__JUMBO_API && window.__JUMBO_API.mode) ? window.__JUMBO_API.mode : 'local'; }

function buildSystemPrompt(){
  var ctx = (window.__JUMBO_API && window.__JUMBO_API.getContext) ? window.__JUMBO_API.getContext() : null;
  var parts = (ctx && ctx.parts) ? ctx.parts : [];
  var params = (ctx && ctx.params) ? ctx.params : {};
  var knowledge = (ctx && ctx.knowledge) ? ctx.knowledge : {};
  var lines = ['你是《三臂凿岩台车》交互教学站的 AI 助教，面向隧道施工机械学习者。'];
  lines.push('回答要求：使用简体中文；简洁、准确、可适当分点；优先依据下方本站内置资料回答；资料未覆盖时按专业常识回答并注明；可建议用户在页面上点击对应部件查看 3D 细节。');
  lines.push('');
  lines.push('【部件清单】');
  parts.forEach(function(p){ lines.push('- ' + (p.id || '') + '：' + (p.name || '') + (p.tag ? '（' + p.tag + '）' : '')); });
  lines.push('');
  lines.push('【技术参数】');
  Object.keys(params).forEach(function(k){
    var sec = params[k];
    lines.push('◆ ' + (sec.title || k));
    (sec.items || []).forEach(function(it){ lines.push('- ' + it[0] + '：' + it[1]); });
    if(sec.note) lines.push('· ' + sec.note);
  });
  lines.push('');
  lines.push('【知识要点】');
  Object.keys(knowledge).forEach(function(k){
    var sec = knowledge[k];
    lines.push('◆ ' + (sec.title || k));
    (sec.points || []).forEach(function(pt){ lines.push('- ' + pt); });
  });
  return lines.join('\n');
}
function chatEndpoint(){
  if(backendMode() === 'server') return '/api/chat';
  if(AI_PROXY_URL) return AI_PROXY_URL;
  return '';
}
function sendQuestion(text){
  var messages = [{role:'system', content: buildSystemPrompt()}]
    .concat(history)
    .concat([{role:'user', content: text}]);
  var url = chatEndpoint();
  if(!url){
    addMsg('bot', '当前环境未配置 AI 通道：\n· 本地模式：运行 start_server.bat，并在 server.py 同目录放好 deepseek_key.txt 后可用；\n· 在线模式：部署 Cloudflare Worker 代理后填入页面顶部的 AI_PROXY_URL。\n详见 README「AI 教学助教」一节。', 'err');
    return;
  }
  setBusy(true);
  setStatus('AI 正在思考…');
  fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ messages: messages, model: AI_MODEL, max_tokens: AI_MAX_TOKENS })
  }).then(function(r){
    return r.json().then(function(j){ return {ok: r.ok, j: j}; });
  }).then(function(res){
    if(res.j && res.j.ok && typeof res.j.reply === 'string'){
      history.push({role:'user', content:text});
      history.push({role:'assistant', content:res.j.reply});
      saveHistory();
      addMsg('bot', res.j.reply);
    } else {
      addMsg('bot', (res.j && res.j.error) ? res.j.error : 'AI 服务返回异常，请稍后再试。', 'err');
    }
    setStatus('');
    setBusy(false);
  }).catch(function(){
    addMsg('bot', '网络请求失败：无法连接 AI 服务，请检查服务是否启动或云端代理是否可用。', 'err');
    setStatus('');
    setBusy(false);
  });
}
function renderHistory(){
  msgsEl.innerHTML = '';
  if(!history.length){
    addMsg('bot', '你好，我是本教学站的 AI 助教。可以问我三臂凿岩台车的部件结构、技术参数、工作原理、装配与维护要点，例如「凿岩机 HC95SA 的冲击频率是多少？」');
    return;
  }
  history.forEach(function(m){
    if(m.role === 'user') addMsg('user', m.content);
    else if(m.role === 'assistant') addMsg('bot', m.content);
  });
}
function openChat(){
  openFlag = true;
  panel.classList.add('open');
  fab.classList.add('on');
  panel.setAttribute('aria-hidden','false');
  loadHistory();
  renderHistory();
  setStatus(backendMode() === 'server' ? '服务端模式 · DeepSeek 已连接' : (AI_PROXY_URL ? '在线模式 · 云端代理转发' : '未配置 AI 通道'));
  setTimeout(function(){ inputEl.focus(); }, 60);
}
function closeChat(){
  openFlag = false;
  panel.classList.remove('open');
  fab.classList.remove('on');
  panel.setAttribute('aria-hidden','true');
}
function submit(){
  var text = inputEl.value.trim();
  if(!text || busy) return;
  inputEl.value = '';
  inputEl.style.height = '';
  addMsg('user', text);
  sendQuestion(text);
}

fab.addEventListener('click', function(){ openFlag ? closeChat() : openChat(); });
fab.addEventListener('keydown', function(e){
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openFlag ? closeChat() : openChat(); }
});
document.getElementById('aiClose').addEventListener('click', closeChat);
document.getElementById('aiClear').addEventListener('click', function(){
  history = [];
  saveHistory();
  renderHistory();
});
sendBtn.addEventListener('click', submit);
inputEl.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submit(); }
});
inputEl.addEventListener('input', function(){
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 110) + 'px';
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && openFlag) closeChat();
});
})();
</script>

(function(){
  var mat = new THREE.LineBasicMaterial({color:0x44505C, transparent:true, opacity:0.6});
  function arcLine(radius, yBase, z, segments){
    var pts = [];
    for(var i=0;i<=segments;i++){
      var a = Math.PI + (Math.PI*(i/segments));
      pts.push(new THREE.Vector3(Math.cos(a)*radius, yBase + Math.sin(a)*radius, z));
    }
    var geo = new THREE.BufferGeometry().setFromPoints(pts);
    return new THREE.Line(geo, mat);
  }
  scene.add(arcLine(30, 0, -30, 80));
  scene.add(arcLine(30, 0, -34, 80));
  scene.add(arcLine(30, 0, -38, 80));
  var baseGeo1 = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-30,0,-30), new THREE.Vector3(30,0,-30)]);
  var baseGeo2 = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-30,0,-38), new THREE.Vector3(30,0,-38)]);
  scene.add(new THREE.Line(baseGeo1, mat));
  scene.add(new THREE.Line(baseGeo2, mat));
  var axisPts = [];
  for(var z=-30; z<=-14; z+=2){ axisPts.push(new THREE.Vector3(0,30,z)); }
  var axisGeo = new THREE.BufferGeometry().setFromPoints(axisPts);
  scene.add(new THREE.Line(axisGeo, mat));
})();

function box(w,h,d,mat,x,y,z,parent){
  var m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);

function cyl(rt,rb,h,seg,mat,x,y,z,parent,rot){
  var m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z);
  if(rot) m.rotation.set(rot.x||0, rot.y||0, rot.z||0);

  parent.add(m);
  return m;
}

function hose(points, radius, mat, parent){
  var curve = new THREE.CatmullRomCurve3(points);

  parent.add(m);
  return m;
}

function tag(group, pid){
  var p = PART_MAP[pid];
  p.group = group;
  group.traverse(function(c){
    if(c.isMesh){
      if(c.userData.partId) return; /* 已被子部件占用 */
      c.userData.partId = pid;
      c.material = c.material.clone();
      p.meshes.push(c);
      clickable.push(c);
    }
  });
}

  hose([new THREE.Vector3(0.2,0.5,0.3), new THREE.Vector3(0.16,0.42,0.9), new THREE.Vector3(0.1,0.32,1.5)], 0.022, new THREE.MeshStandardMaterial({color:0x1F3A52,roughness:0.6}), arm);

  PART_MAP['short'+n].focusPoint.set(cfg.x, cfg.y+1.05, cfg.z+3.4);
  PART_MAP['tbeam'+n].focusPoint.set(cfg.x, cfg.y+1.1, cfg.z+4.1);
  PART_MAP['feed'+n].focusPoint.set(cfg.x, cfg.y+0.95, cfg.z+4.4);
  PART_MAP['drill'+n].focusPoint.set(cfg.x, cfg.y+1.05, cfg.z+4.9);

  /* 爆炸图 */
  EXPLODABLES.push({obj:g, orig:g.position.clone(), dir:cfg.edir, dist:cfg.edist, extraZ:null});
  EXPLODABLES.push({obj:tbeam, orig:tbeam.position.clone(), dir:new THREE.Vector3(0,0.12,1).normalize(), dist:0.7, extraZ:null});
  EXPLODABLES.push({obj:feed, orig:feed.position.clone(), dir:new THREE.Vector3(0,0.18,1).normalize(), dist:1.2, extraZ:null});
  EXPLODABLES.push({obj:drill, orig:drill.position.clone(), dir:new THREE.Vector3(0,0.12,1).normalize(), dist:0.9, extraZ:null});
  EXPLODABLES.push({obj:rod, orig:rod.position.clone(), dir:new THREE.Vector3(0,0,1), dist:1.3, extraZ:function(){return rodState.v;}});
  return {group:g, arm:arm, rodState:rodState};
}

var raycaster = new THREE.Raycaster();
var ndc = new THREE.Vector2();
function pickAt(clientX, clientY){
  var r = renderer.domElement.getBoundingClientRect();
  ndc.x = ((clientX - r.left)/r.width)*2 - 1;
  ndc.y = -((clientY - r.top)/r.height)*2 + 1;
  raycaster.setFromCamera(ndc, camera);
  var hits = raycaster.intersectObjects(clickable, false);
  return hits.length ? hits[0].object.userData.partId : null;
}
var hoverId = null, selId = null;
var downX = 0, downY = 0;
renderer.domElement.addEventListener('pointermove', function(ev){
  hoverId = pickAt(ev.clientX, ev.clientY);
  renderer.domElement.style.cursor = hoverId ? 'pointer' : 'grab';
});
renderer.domElement.addEventListener('pointerleave', function(){ hoverId = null; });
renderer.domElement.addEventListener('pointerdown', function(ev){
  downX = ev.clientX; downY = ev.clientY;
  focusTarget = null; /* 用户开始自由旋转时取消自动聚焦 */
});
renderer.domElement.addEventListener('pointerup', function(ev){
  var dx = ev.clientX - downX, dy = ev.clientY - downY;
  if(dx*dx + dy*dy < 64){
    var id = pickAt(ev.clientX, ev.clientY);
    selectPart(id, true);
    if(id) reportAction('click', {partId:id});
  }
});

  var k = Math.min(1, dt*10);
  PARTS.forEach(function(p){
    var c = EM_NONE, inten = 0;
    if(p.id === selId){ c = EM_SEL; inten = 0.55; }

/* ================= 视角复位 / 开场动画 ================= */
var resetT = 1;
var resetFromPos = new THREE.Vector3(), resetFromTgt = new THREE.Vector3();
var resetToPos = new THREE.Vector3(17, 10.5, 18), resetToTgt = new THREE.Vector3(0, 2.0, 0.6);
function resetView(){
  resetFromPos.copy(camera.position);
  resetFromTgt.copy(controls.target);
  resetT = 0;
}
var INTRO_FROM = new THREE.Vector3(30, 18, 34);
var INTRO_TO = new THREE.Vector3(17, 10.5, 18);
var INTRO_T_FROM = new THREE.Vector3(0, 1.4, 0);
var INTRO_T_TO = new THREE.Vector3(0, 2.0, 0.6);
var introDur = reduceMotion ? 0 : 4.4;
var introT = 0, introDone = false;
if(reduceMotion){
  camera.position.copy(INTRO_TO);
  controls.target.copy(INTRO_T_TO);
  booms.forEach(function(b){ b.arm.rotation.x = b.workAngle; b.rodState.v = 0; });
  introDone = true;
} else {
  camera.position.copy(INTRO_FROM);
  controls.target.copy(INTRO_T_FROM);
}
function easeInOut(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
function stepIntro(dt){
  introT += dt;
  var k = Math.min(introT/introDur, 1), e = easeInOut(k);
  camera.position.lerpVectors(INTRO_FROM, INTRO_TO, e);
  controls.target.lerpVectors(INTRO_T_FROM, INTRO_T_TO, e);
  booms.forEach(function(b){
    b.arm.rotation.x = b.stowedAngle + (b.workAngle - b.stowedAngle)*e;
    b.rodState.v = 0.3*e;
  });
  if(k >= 1){
    introDone = true;
    controls.enabled = true;
  }
}

/* ================= 凿岩演示 / 爆炸图动画 ================= */
var E = 0;
function stepDemo(dt, t){
  booms.forEach(function(b){
    if(demoOn){
      var cyc = b.demoPeriod;
      var p = ((t + b.demoOffset) % cyc)/cyc;
      var arm = b.workAngle, adv = 0;
      if(p < 0.16){ arm = b.workAngle - 0.10*easeInOut(p/0.16); }
      else if(p < 0.30){ arm = b.workAngle - 0.10; adv = 1.05*easeInOut((p-0.16)/0.14); }
      else if(p < 0.55){ arm = b.workAngle - 0.10; adv = 1.05; }
      else if(p < 0.69){ arm = b.workAngle - 0.10; adv = 1.05*(1 - easeInOut((p-0.55)/0.14)); }
      else if(p < 0.84){ arm = b.workAngle - 0.10*(1 - easeInOut((p-0.69)/0.15)); }
      b.arm.rotation.x = arm;
      b.rodState.v = adv;
    } else {
      b.arm.rotation.x += (b.workAngle - b.arm.rotation.x)*Math.min(1, dt*6);
      b.rodState.v += (0 - b.rodState.v)*Math.min(1, dt*6);
    }
  });
}
function stepExplode(dt){
  var target = explodeOn ? 1 : 0;
  E += (target - E)*Math.min(1, dt*4.5);
  EXPLODABLES.forEach(function(x){
    x.obj.position.copy(x.orig).addScaledVector(x.dir, x.dist*E);
    if(x.extraZ) x.obj.position.z += x.extraZ();
  });
}

/* ================= 渲染循环 ================= */
var clock = new THREE.Clock();
var running = true, raf = null;
function animate(){
  if(!running) return;
  raf = requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 0.05);
  var t = clock.elapsedTime;
  if(!introDone) stepIntro(dt);
  stepDemo(dt, t);
  stepExplode(dt);
  updateEmissive(dt);
  updateLabels();
  if(resetT < 1){
    resetT = Math.min(1, resetT + dt/0.9);
    var re = easeInOut(resetT);
    camera.position.lerpVectors(resetFromPos, resetToPos, re);
    controls.target.lerpVectors(resetFromTgt, resetToTgt, re);
  }
  if(focusTarget && introDone){
    controls.target.lerp(focusTarget, 1 - Math.pow(0.0004, dt));
  }
  controls.update();
  renderer.render(scene, camera);
}
window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ running = false; cancelAnimationFrame(raf); }
  else { running = true; clock.getDelta(); animate(); }
});

/* ================= 前后端交互（双模式：服务端 API / 本地存储） ================= */
var BACKEND = {
  mode: 'local',            /* 'server' | 'local' */
  probeDone: false,
  LS_KEY: 'jumbo_learning_state_v2'
};
function loadLS(){
  try{ return JSON.parse(localStorage.getItem(BACKEND.LS_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveLS(s){
  try{ localStorage.setItem(BACKEND.LS_KEY, JSON.stringify(s)); }catch(e){}
}
function reportAction(action, opt){
  opt = opt || {};
  var body = {
    action: action,
    partId: opt.partId || '',
    ms: opt.ms || 0,
    ts: Date.now()
  };
  if(BACKEND.mode === 'server'){
    fetch('/api/interactions', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    }).catch(function(){});
    return;
  }
  var s = loadLS();
  if(action === 'session'){ s.sessions = (s.sessions||0) + 1; }
  else if(action === 'click' && body.partId){
    s.clicks = s.clicks || {};
    s.clicks[body.partId] = (s.clicks[body.partId]||0) + 1;
  }
  else if(action === 'demo'){ s.demo_plays = (s.demo_plays||0) + 1; }
  else if(action === 'explode'){ s.explode_plays = (s.explode_plays||0) + 1; }
  else if(action === 'reset'){ s.view_resets = (s.view_resets||0) + 1; }
  else if(action === 'time'){ s.total_time_ms = (s.total_time_ms||0) + Math.max(0, body.ms||0); }
  saveLS(s);
}
var lastTickTs = Date.now();
function startTimeLoop(){
  lastTickTs = Date.now();
  setInterval(function(){
    var now = Date.now();
    var ms = now - lastTickTs;
    lastTickTs = now;
    reportAction('time', {ms: ms});
  }, 30000);
}
function probeBackend(){
  var done = false;
  function finish(){
    if(done) return; done = true;
    BACKEND.probeDone = true;
    updateApiChip();
    reportAction('session');
    startTimeLoop();
    if(BACKEND.mode === 'server'){
      fetch('/api/params', {cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
        if(j && j.drill_boom) PARAMS = j;
      }).catch(function(){});
      fetch('/api/knowledge', {cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
        if(j && j.structure) KNOWLEDGE = j;
      }).catch(function(){});
    }
  }
  /* 直接打开本地文件（file://）时跳过探测，直接进入本地模式，避免跨源请求报错 */
  if(location.protocol === 'file:'){ BACKEND.mode = 'local'; finish(); return; }
  var timer = setTimeout(finish, 2500);
  fetch('/api/health', {method:'GET', cache:'no-store'})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){ if(j && j.ok){ BACKEND.mode = 'server'; } })
    .catch(function(){})
    .then(function(){ clearTimeout(timer); finish(); });
}
function updateApiChip(){
  var chip = document.getElementById('apiChip');
  var txt = document.getElementById('apiChipTxt');
  if(BACKEND.mode === 'server'){
    chip.classList.add('on'); chip.classList.remove('off');
    txt.textContent = '已连接教学服务';
  } else {
    chip.classList.add('off'); chip.classList.remove('on');
    txt.textContent = '本地模式 · 记录存于本机';
  }
}

/* ================= 学习资料面板 ================= */
var learnPanel = document.getElementById('learnPanel');
function openLearn(){
  learnPanel.classList.add('open');
  learnPanel.setAttribute('aria-hidden', 'false');
  renderParams(); renderKnowledge(); renderStats();
}
function closeLearn(){
  learnPanel.classList.remove('open');
  learnPanel.setAttribute('aria-hidden', 'true');
}
document.getElementById('learnClose').addEventListener('click', closeLearn);
document.querySelectorAll('.lp-tab').forEach(function(tab){
  tab.addEventListener('click', function(){
    document.querySelectorAll('.lp-tab').forEach(function(t){ t.classList.remove('on'); });
    document.querySelectorAll('.tab-pane').forEach(function(p){ p.classList.remove('on'); });
    tab.classList.add('on');
    document.getElementById('pane-' + tab.getAttribute('data-tab')).classList.add('on');
  });
});
function renderParams(){
  var el = document.getElementById('pane-params');
  var html = '';
  Object.keys(PARAMS).forEach(function(k){
    var g = PARAMS[k];
    html += '<div class="pgroup"><div class="pg-title">'+g.title+'</div><table>';
    g.items.forEach(function(r){
      html += '<tr><td class="k">'+r[0]+'</td><td class="v">'+r[1]+'</td></tr>';
    });
    html += '</table>'+(g.note ? '<div class="pg-note">'+g.note+'</div>' : '')+'</div>';
  });
  el.innerHTML = html;
}
function renderKnowledge(){
  var el = document.getElementById('pane-knowledge');
  var html = '';
  Object.keys(KNOWLEDGE).forEach(function(k){
    var g = KNOWLEDGE[k];
    html += '<div class="kgroup"><div class="kg-title">'+g.title+'</div><ul>';
    g.points.forEach(function(p){ html += '<li>'+p+'</li>'; });
    html += '</ul></div>';
  });
  el.innerHTML = html;
}
function fmtDuration(ms){
  if(!ms) return '0 分';
  var s = Math.round(ms/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return h ? (h+' 时 '+m+' 分') : (m+' 分 '+(s%60)+' 秒');
}
function renderStats(){
  var el = document.getElementById('pane-stats');
  if(BACKEND.mode === 'server'){
    fetch('/api/interactions', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
      el.innerHTML = statsHTML(j.state, j.top || [], true);
    }).catch(function(){
      el.innerHTML = statsHTML(null, [], false);
    });
  } else {
    var s = loadLS();
    var top = Object.keys(s.clicks || {}).map(function(id){
      return {id:id, count:s.clicks[id]};
    }).sort(function(a,b){ return b.count - a.count; }).slice(0, 8);
    el.innerHTML = statsHTML({
      sessions:s.sessions||0, demo_plays:s.demo_plays||0, explode_plays:s.explode_plays||0,
      view_resets:s.view_resets||0, total_time_ms:s.total_time_ms||0,
      click_total:top.reduce(function(a,b){ return a+b.count; }, 0)
    }, top, false);
  }
}
function statsHTML(st, top, fromServer){
  if(!st || !(st.sessions || st.click_total || st.demo_plays || st.explode_plays || st.view_resets || st.total_time_ms)){
    return '<div class="stat-empty">还没有学习记录。<br>试试：点击模型部件、播放凿岩演示、切换爆炸图——行为会自动记录。</div>';
  }
  var cards = [
    ['会话次数', st.sessions], ['演示次数', st.demo_plays], ['爆炸图', st.explode_plays],
    ['视角复位', st.view_resets], ['学习时长', fmtDuration(st.total_time_ms)], ['部件点击', st.click_total]
  ];
  var html = '<div class="stat-grid">';
  cards.forEach(function(c){
    html += '<div class="stat-card"><div class="num">'+c[1]+'</div><div class="lbl">'+c[0]+'</div></div>';
  });
  html += '</div>';
  var max = 1;
  top.forEach(function(t){ if(t.count > max) max = t.count; });
  if(top && top.length){
    html += '<div class="kgroup"><div class="kg-title">部件点击排行</div>'+
      '<div class="rank-head"><span class="rk">#</span><span class="rn">部件</span><span class="rv">次数</span></div>';
    top.forEach(function(t, i){
      var nm = (PART_MAP[t.id] && PART_MAP[t.id].name) ? PART_MAP[t.id].name : t.id;
      html += '<div class="rank-row"><span class="rk">'+(i+1)+'</span><span class="rn">'+nm+'</span>'+
        '<span class="bar"><i style="width:'+Math.max(8, Math.round(t.count/max*100))+'%"></i></span>'+
        '<span class="rv">'+t.count+'</span></div>';
    });
    html += '</div>';
  }
  html += '<div class="stat-mode">'+
    (fromServer ? '<b>服务端模式</b>：学习数据由本机教学服务（server.py）统一保存，同一台服务器上所有访问者的记录会合并统计。' :
                 '<b>本地模式</b>：当前为静态/离线环境，学习数据保存在当前浏览器（localStorage），换设备或清缓存会清空。')+
    '</div>';
  return html;
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ selectPart(null); closeDrawer(); closeLearn(); }
});

/* ================= 初始化 ================= */
function hideSplash(){
  var s = document.getElementById('splash');
  if(s && !s.classList.contains('done')){
    s.classList.add('done');
    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 650);
  }
}
try{
  buildPanel();
  buildLabels();
  labelsEl.classList.remove('hide');
  renderer.render(scene, camera);
  document.body.classList.add('ready');
  hideSplash();
  animate();
  probeBackend();
  window.__JUMBO_API = {
    get mode(){ return BACKEND.mode; },
    getContext: function(){
      return { parts: PARTS || [], params: PARAMS || {}, knowledge: KNOWLEDGE || {} };
    }
  };
  window.__JUMBO_READY = true;
}catch(err){
  console.error(err);
  showErr(err.message);
}
})();
